name: Sync Beer Inventory

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Generate _data/beers.yml from recipe repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          OUTPUT="_data/beers.yml"
          mkdir -p _data

          # Find all repositories in the org with the "recipe" topic
          repos=$(gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${ORG}/repos?type=public&per_page=100" \
            --jq '.[].name')

          beers=""
          for repo in $repos; do
            # Check whether this repo has the "recipe" topic
            topics=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${ORG}/${repo}/topics" \
              --jq '.names[]' 2>/dev/null || true)

            if ! echo "$topics" | grep -qx "recipe"; then
              continue
            fi

            echo "Found recipe repo: ${repo}"

            # Fetch the beer.yml file from the default branch
            content=$(gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "/repos/${ORG}/${repo}/contents/beer.yml" \
              2>/dev/null || true)

            if [ -z "$content" ]; then
              echo "  No beer.yml found in ${repo}, skipping."
              continue
            fi

            echo "  Adding beer(s) from ${repo}"
            beers="${beers}${content}"$'\n'
          done

          if [ -z "$beers" ]; then
            echo "No beer.yml files found in any recipe repository."
            # Write an empty list so the site still builds
            printf '# Auto-generated by sync-beers workflow. Do not edit manually.\n[]\n' > "${OUTPUT}"
          else
            {
              printf '# Auto-generated by sync-beers workflow. Do not edit manually.\n'
              printf '%s' "$beers"
            } > "${OUTPUT}"
          fi

          echo "Generated ${OUTPUT}:"
          cat "${OUTPUT}"

      - name: Commit updated beer inventory
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/beers.yml
          if git diff --cached --quiet; then
            echo "No changes to _data/beers.yml — nothing to commit."
          else
            git commit -m "chore: sync beer inventory from recipe repositories"
            git push
          fi
