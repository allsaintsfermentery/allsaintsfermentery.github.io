name: Sync Beer Inventory

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Generate _data/beers.yml from recipe repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          mkdir -p _data

          # Find all public repositories in the org with the "recipe" topic
          # using the search API (one call, no per-repo topic check needed)
          repos=$(gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/search/repositories?q=org:${ORG}+topic:recipe&per_page=100" \
            --jq '.items[].name' | tr '\n' ' ')

          python3 .github/scripts/sync_beers.py "_data/beers.yml" $repos

      - name: Commit updated beer inventory
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/beers.yml
          if git diff --cached --quiet; then
            echo "No changes to _data/beers.yml — nothing to commit."
            exit 0
          fi

          BRANCH="chore/sync-beers-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "chore: sync beer inventory from recipe repositories"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: sync beer inventory from recipe repositories" \
            --body "Auto-generated by the Sync Beer Inventory workflow." \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH"
        env:
          # GITHUB_TOKEN cannot create PRs when the org-level setting
          # "Allow GitHub Actions to create and approve pull requests" is disabled.
          # A PAT with `repo` scope from a human account is used instead.
          GH_TOKEN: ${{ secrets.PAT }}
