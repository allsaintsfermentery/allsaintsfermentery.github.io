name: Sync Beer Inventory

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Generate _data/beers.yml from recipe repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          mkdir -p _data

          # Find all public repositories in the org with the "recipe" topic
          # using the search API (one call, no per-repo topic check needed)
          repos=$(gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/search/repositories?q=org:${ORG}+topic:recipe&per_page=100" \
            --jq '.items[].name' | tr '\n' ' ')

          python3 .github/scripts/sync_beers.py "_data/beers.yml" $repos

      - name: Commit updated beer inventory and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          branch="chore/sync-beer-inventory"
          title="chore: sync beer inventory from recipe repositories"
          body="Automated update to \`_data/beers.yml\` from recipe repositories."

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/beers.yml
          if git diff --cached --quiet; then
            echo "No changes to _data/beers.yml — nothing to commit."
            exit 0
          fi

          git switch -C "$branch"
          git commit -m "$title"
          git push --force-with-lease origin "HEAD:$branch"

          pr_number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi
