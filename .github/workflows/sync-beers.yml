name: Sync Beer Inventory

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Generate _data/beers.yml from recipe repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          mkdir -p _data

          # Find all public repositories in the org with the "recipe" topic
          # using the search API (one call, no per-repo topic check needed)
          repos=$(gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/search/repositories?q=org:${ORG}+topic:recipe&per_page=100" \
            --jq '.items[].name' | tr '\n' ' ')

          python3 .github/scripts/sync_beers.py "_data/beers.yml" $repos

      - name: Create pull request for updated beer inventory
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          add-paths: _data/beers.yml
          branch: chore/sync-beer-inventory
          commit-message: "chore: sync beer inventory from recipe repositories"
          delete-branch: true
          title: "chore: sync beer inventory from recipe repositories"
          body: |
            Automated update to `_data/beers.yml` from recipe repositories.
